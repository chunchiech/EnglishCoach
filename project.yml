name: EnglishCoach
options:
  bundleIdPrefix: com.andy
targets:
  EnglishCoach:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EnglishCoach
    settings:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 2P8SRV3VG2
      PRODUCT_BUNDLE_IDENTIFIER: com.andy.EnglishCoach
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UIRequiresFullScreen: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_CFBundleDisplayName: "EnglishCoach - 多益單字與口說教練"
      MARKETING_VERSION: "1.1.0"
      CURRENT_PROJECT_VERSION: "1"
schemes:
  EnglishCoach:
    build:
      targets:
        EnglishCoach: all
    run:
      config: Debug
      storeKitConfiguration: EnglishCoach/Resources/EnglishCoach.storekit


